aid: vegrow
name: Vegrow
description: 'Vegrow is a Bengaluru-based B2B fruits marketplace founded in 2020 by IIT
  alumni that connects Indian fruit farmers with demand outlets across retail channels,
  using technology to match produce such as apples, bananas, pomegranates, and grapes
  with buyers, handling grading, sorting, quality assurance, and delivery, and paying
  farmers digitally. Backed by GIC, Prosus Ventures, Matrix Partners India, Elevation
  Capital, Lightspeed, and Ankur Capital, it raised a $46M round led by GIC in December
  2023. Vegrow publishes no public API or developer program today.'
